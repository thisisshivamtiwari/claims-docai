[project]
name = "claims-docai"
version = "0.1.0"
description = "Insurance claim receipts to structured data: OCR, extraction, field confidence and a human-review queue"
readme = "README.md"
authors = [
    { name = "Shivam Tiwari" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.0",
    "pillow>=13.0.0",
    "pyarrow>=26.0.1",
    "python-multipart>=0.0.33",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
local = [
    "mlx-lm>=0.32.2 ; sys_platform == 'darwin'",
    "mlx-vlm>=0.7.12 ; sys_platform == 'darwin'",
    "ocrmac>=1.0.1 ; sys_platform == 'darwin'",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
