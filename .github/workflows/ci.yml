# Lint, tests, and the eval gate. The gate replays cached OCR (data/ocr/) and recorded model responses (cassettes/),
# so it needs no Mac, GPU or API key; it fails if the evaluation no longer reproduces results/eval.json or if the
# auto-approved fields on the test split fall below the precision floor.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Tests
        run: uv run pytest -q
      - name: Eval gate (replay)
        run: uv run python -m claims_docai ci
